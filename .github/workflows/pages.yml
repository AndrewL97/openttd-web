
name: Build and deploy OpenTTD WebAssembly

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout web wrapper
        uses: actions/checkout@v4

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip file cmake

      - name: Build OpenTTD for browser
        env:
          SOURCE_REPOSITORY: https://github.com/OpenTTD/OpenTTD.git
          SOURCE_REF: master
        run: bash scripts/build.sh

      - name: Validate WebAssembly artifacts
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            index.html \
            openttd.js \
            openttd.wasm \
            openttd.data
          do
            test -s "dist/$file"
          done

          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openttd-web
          path: dist/
          retention-days: 30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy OpenTTD Web
