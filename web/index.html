
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTTD Web Test</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #error { color: white; font: 16px sans-serif; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <pre id="error"></pre>
  <script>
    var canvas = document.getElementById("game");
    var Module = {
      canvas: canvas,
      locateFile: function(path) {
        return path.endsWith(".wasm") ? "./openttd.wasm" : "./" + path;
      },
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      onAbort: function(reason) {
        document.getElementById("error").textContent = String(reason);
      }
    };
    var script = document.createElement("script");
    script.src = "./openttd.js";
    script.onerror = function() {
      document.getElementById("error").textContent = "Failed to load openttd.js";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
